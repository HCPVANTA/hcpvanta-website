<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | HCPVanta</title>
<style>
  :root { color-scheme: light dark; --bg: #F7F9F8; --ink: #16252B; --muted: #55666B; --teal: #2F6F6A; --teal-ink: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1A1D; --ink: #E6EEEC; --muted: #A3B4B5; --teal: #6FB8AF; --teal-ink: #0F1A1D; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, Arial, sans-serif; text-align: center; padding: 1.5rem; }
  .brand { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.02em; }
  .brand span { color: var(--teal); }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 1.5rem 0 0.5rem; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 1.75rem; }
  a.btn { display: inline-block; background: var(--teal); color: var(--teal-ink); font-weight: 700; text-decoration: none; padding: 0.85rem 1.4rem; border-radius: 999px; }
</style>
</head>
<body>
  <main>
    <div class="brand">HCP<span>Vanta</span></div>
    <h1>That page isn’t here.</h1>
    <p>The link may be old, or the address may have a typo.</p>
    <a class="btn" href="/">Go to the homepage</a>
  </main>
</body>
</html>
